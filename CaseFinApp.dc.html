</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  frameRef = React.createRef();

  renderVals() {
    return { frameRef: this.frameRef, onFrameLoad: () => this.resize() };
  }

  resize() {
    const el = this.frameRef.current;
    if (!el) return;
    try {
      const doc = el.contentDocument;
      if (doc && doc.documentElement) {
        const bar = doc.querySelector('.topbar');
        if (bar) bar.style.display = 'none';
        el.style.height = doc.documentElement.scrollHeight + 'px';
      }
    } catch (e) {}
    this.dismissSkeleton();
  }

  componentDidMount() {
    window.addEventListener('resize', () => this.resize());
    setTimeout(() => this.resize(), 4000);
  }

  dismissSkeleton() {
    const el = document.getElementById('skeleton');
    if (!el || el.hidden) return;
    el.style.transition = 'opacity .4s ease';
    el.style.opacity = '0';
    setTimeout(() => { el.hidden = true; }, 400);
  }
}

</script>
